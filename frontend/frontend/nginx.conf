server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # le immagini dei tornei arrivano fino a 2 MB (il default di nginx è 1 MB)
    client_max_body_size 3m;

    # chiamate API -> container del backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # immagini caricate dall'admin -> servite dal backend
    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # tutte le altre pagine sono rotte di Angular: si riparte da index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
