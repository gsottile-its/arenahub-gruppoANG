services:
  backend:
    build: ./backend/backend
    env_file: .env            
    environment:
     
      APP_BASE_URL: http://localhost:4200
      APP_CORS_ORIGINI: http://localhost:4200
    volumes:
      - uploads:/app/uploads  
    ports:
      - "8080:8080"          

  frontend:
    build: ./frontend/frontend
    ports:
      - "4200:80"            
    depends_on:
      - backend

volumes:
  uploads:
